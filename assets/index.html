<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grandview Gardens</title>
        <link rel="icon" type="image/x-icon" href="Logo Asset/GGLogo.svg">   
        <link rel="stylesheet" href="style.css?v=20260924-hill-width" />
    </head>
    <body>
        <div class="nav-bar">
            <div class="nav-links">
                <a href="#welcome" aria-label="Home">
                    <img src="Nav assets/logo_Home_Nav.png" alt="Grandview Gardens Logo" />
                </a>
                <a href="#about" aria-label="About">
                    <img src="Nav assets/about_Nav.png" alt="About Icon"/>
                </a>
                <a href="#offerings" aria-label="Offerings">
                    <img src="Nav assets/offerings_Nav.png" alt="Offerings Icon"/>
                </a>
                <a href="#visit" aria-label="Visit">
                    <img src="Nav assets/visit_Nav.png" alt="Visit Icon"/>
                </a>
                <a href="#connect" aria-label="Contact">
                    <img src="Nav assets/contact_Nav.png" alt="Contact Icon"/>
                </a>
                <a href="#donate" aria-label="Donate">
                    <img src="Nav assets/donate_Nav.png" alt="Donate Icon"/>
                </a>
            </div>
        </div>

        <div class="container">
            
            <div class="progress-bar">
            </div>

            <div class="progress-counter">
                <h1>0</h1>
            </div>

            <div class="scroller">
                <section id="welcome" class="welcome">
                    <div class="welcome-stage">
                        <img src="Welcome About Assets/welcome_Banner.png" alt="Welcome to Grandview Gardens" class="welcome-banner welcome-layer" />
                        <img src="Welcome About Assets/gardening_Doodle_About.png.png" alt="Gardener illustration" class="gardening-doodle welcome-layer" data-scroll-reveal="flip-up" />
                        <img src="Hill Foreground Assets/summer_Hill_Forground.png" alt="Grandview Gardens hillside" class="hill-foreground welcome-layer" />
                    </div>
                </section>
                <section id="about" class="about">
                    <div class="about-stage">
                        <img src="Welcome About Assets/post_Sign_About.png" alt="About Us" class="about-sign about-layer" data-scroll-reveal="flip-up" data-reveal-fade />
                        <img src="Welcome About Assets/text1_about.png" alt="Grandview Gardens is an emerging sacred space nestled on the edge of Pittsburgh, PA." class="about-card about-card-one about-layer" />
                        <img src="Welcome About Assets/text2_about.png" alt="It is lovingly stewarded by a community of healing artists who believe in collective care." class="about-card about-card-two about-layer" />
                        <img src="Welcome About Assets/test3_about.png" alt="We create opportunities for people to connect with themselves, each other, and the Land." class="about-card about-card-three about-layer" />
                        <img src="Welcome About Assets/marigold_About.png" alt="Marigold flower" class="about-marigold about-layer" />
                        <img src="Welcome About Assets/hanging_Herbs_About.png" alt="Hanging garden herbs" class="about-herbs about-layer" />
                        <img src="Hill Foreground Assets/fall_Hill_Forground.png" alt="Grandview Gardens fall hillside" class="hill-foreground about-hill about-layer" />
                    </div>
                </section>
                <section id="offerings" class="offerings">
                </section>
                <section id="visit" class="visit">
                </section>
                <section id="connect" class="connect">
                </section>
                <section id="donate" class="donate">
                </section>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
