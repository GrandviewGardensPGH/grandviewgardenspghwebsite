<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grandview Gardens</title>
        <link rel="icon" type="image/x-icon" href="Logo Asset/GGLogo.svg">   
        <link rel="stylesheet" href="style.css?v=visit-hill-height-1" />
    </head>
    <body>
        <div class="nav-bar">
            <div class="nav-links">
                <a href="#welcome" aria-label="Home">
                    <img src="Nav Assets/logo_Home_Nav.png" alt="Grandview Gardens Logo" />
                </a>
                <a href="#about" aria-label="About">
                    <img src="Nav Assets/about_Nav.png" alt="About Icon"/>
                </a>
                <a href="#offerings" aria-label="Offerings">
                    <img src="Nav Assets/offerings_Nav.png" alt="Offerings Icon"/>
                </a>
                <a href="#visit" aria-label="Visit">
                    <img src="Nav Assets/visit_Nav.png" alt="Visit Icon"/>
                </a>
                <a href="#connect" aria-label="Contact">
                    <img src="Nav Assets/contact_Nav.png" alt="Contact Icon"/>
                </a>
                <a href="#donate" aria-label="Donate">
                    <img src="Nav Assets/donate_Nav.png" alt="Donate Icon"/>
                </a>
            </div>
        </div>

        <div class="container">
            
            <div class="progress-bar">
            </div>

            <div class="progress-counter">
                <h1>0</h1>
            </div>

            <div class="scroller">
                <section id="welcome" class="welcome">
                    <div class="welcome-stage">
                        <img src="Welcome About Assets/welcome_Banner.png" alt="Welcome to Grandview Gardens" class="welcome-banner welcome-layer" />
                        <img src="Welcome About Assets/gardening_Doodle_About.png.png" alt="Gardener illustration" class="gardening-doodle welcome-layer" data-scroll-reveal="flip-up" />
                        <img src="Hill Foreground Assets/summer_Hill_Forground_cropped.png" alt="Grandview Gardens hillside" class="hill-foreground welcome-layer" />
                    </div>
                </section>
                <section id="about" class="about">
                    <div class="about-stage">
                        <img src="Welcome About Assets/post_Sign_About.png" alt="About Us" class="about-sign about-layer" data-scroll-reveal="flip-up" data-reveal-fade />
                        <img src="Welcome About Assets/text1_about.png" alt="Grandview Gardens is an emerging sacred space nestled on the edge of Pittsburgh, PA." class="about-card about-card-one about-layer" />
                        <img src="Welcome About Assets/text2_about.png" alt="It is lovingly stewarded by a community of healing artists who believe in collective care." class="about-card about-card-two about-layer" />
                        <img src="Welcome About Assets/test3_about.png" alt="We create opportunities for people to connect with themselves, each other, and the Land." class="about-card about-card-three about-layer" />
                        <!-- <img src="Welcome About Assets/marigold_About.png" alt="Marigold flower" class="about-marigold about-layer" /> -->
                        <!-- <img src="Welcome About Assets/hanging_Herbs_About.png" alt="Hanging garden herbs" class="about-herbs about-layer" /> -->
                        <img src="Hill Foreground Assets/fall_Hill_Forground_cropped.png" alt="Grandview Gardens fall hillside" class="hill-foreground about-hill about-layer" />
                    </div>
                </section>
                <section id="offerings" class="offerings">
                    <div class="content-stage offerings-stage">
                        <img src="Offerings Assets/post_Sign_offerings.png" alt="Our Offerings" class="section-sign" data-scroll-reveal="flip-up" data-reveal-fade />
                        <img src="Offerings Assets/text_Offerings.png" alt="Our offerings are an extension of the land's abundance. We currently offer three tea blends for individuals and wholesale." class="offerings-intro" />
                        <div class="offerings-list">
                            <article class="offering-card offering-tea">
                                <img src="Offerings Assets/tea_Pouring_Offerings.png" alt="Tea being poured into a cup" />
                                <img src="Offerings Assets/tea_Order_Button.png" alt="Order tea" class="offering-action-art" />
                            </article>
                            <article class="offering-card">
                                <img src="Offerings Assets/vitalitea_Offerings.png" alt="Vitalitea herbal tea blend" />
                            </article>
                            <article class="offering-card">
                                <img src="Offerings Assets/soap_Offerings.png" alt="Handmade garden soap" />
                            </article>
                            <article class="offering-card">
                                <img src="Offerings Assets/freedom_Presence_Offerings.png" alt="Freedom Is Presence community offering" />
                            </article>
                        </div>
                        <img src="Hill Foreground Assets/spring_Hill_Forground_cropped.png" alt="" aria-hidden="true" class="hill-foreground section-hill" />
                    </div>
                </section>
                <section id="visit" class="visit">
                    <div class="content-stage visit-stage">
                        <img src="Visit Assets/post_Sign_Visit.png" alt="Visit Grandview Gardens" class="section-sign" data-scroll-reveal="flip-up" data-reveal-fade />
                        <div class="visit-main">
                            <div class="visit-copy">
                                <img src="Visit Assets/text1_Visit.png" alt="The gardens are a living ecosystem, tea house, and third space for the community. We want to offer this space to host events; you are always welcome to come as you are." />
                                <img src="Visit Assets/text2_Visit.png" alt="Discover and learn by visiting our food, flower, and herb gardens, wildlife sanctuary, and apiary. We are happy to teach what we know and share what we grow." />
                            </div>
                            <div class="visit-scene">
                                <img src="Visit Assets/gardens_Visit.png" alt="Grandview Gardens outdoor garden and gathering space" class="visit-garden" />
                                <div class="visit-features">
                                    <img src="Visit Assets/text3_Experience_Visit.png" alt="Experience" />
                                    <img src="Visit Assets/text4_ThirdSpace_Visit.png" alt="The Gardens as a third space" />
                                </div>
                            </div>
                        </div>
                        <div class="visit-footer">
                            <div class="visit-figures" aria-hidden="true">
                                <img src="Visit Assets/deer_Visit.png" alt="" />
                                <img src="Visit Assets/bee_Keeper_Visit.png" alt="" />
                                <img src="Visit Assets/bee_Hive_Visit.png" alt="" />
                            </div>
                            <div class="visit-actions">
                                <a href="mailto:grandviewgardenspgh@proton.me" aria-label="Email us to host an event">
                                    <img src="Visit Assets/email_Button.png" alt="Email us to host an event" />
                                </a>
                                <img src="Visit Assets/upcoming_Events_Button.png" alt="Upcoming events" />
                            </div>
                        </div>
                        <img src="Hill Foreground Assets/winter1_Hill_Foreground.png" alt="" aria-hidden="true" class="hill-foreground section-hill" />
                    </div>
                </section>
                <section id="connect" class="connect">
                    <div class="content-stage connect-stage">
                        <img src="Contact Donate Assets/post_Sign_Contact.png" alt="Contact Grandview Gardens" class="section-sign" data-scroll-reveal="flip-up" data-reveal-fade />
                        <img src="Contact Donate Assets/text_Contact.png" alt="Call 412-444-8707, email grandviewgardenspgh@proton.me, or find us on Instagram at @grandviewgardenspgh." class="contact-details-art" />
                        <img src="Hill Foreground Assets/winter2_Hill_Foreground.png" alt="" aria-hidden="true" class="hill-foreground section-hill" />
                    </div>
                </section>
                <section id="donate" class="donate">
                    <div class="content-stage donate-stage">
                        <img src="Contact Donate Assets/post_Sign_Goals.png" alt="Support our goals" class="section-sign" data-scroll-reveal="flip-up" data-reveal-fade />
                        <div class="donate-main">
                            <img src="Contact Donate Assets/text_Goals.png" alt="We need financial support to keep this project and community space going. See our map of the vision for the space as we continue working on it over the next few years." class="donate-copy" />
                            <img src="Contact Donate Assets/map_Donate.png" alt="Grandview Gardens design plan 2027-2028, showing the planned gardens, trails, apiary, gathering areas, and other project goals." class="donate-map" />
                            <img src="Contact Donate Assets/welcome_Here_Contact.png" alt="You are welcome here" class="donate-welcome" />
                        </div>
                        <img src="Hill Foreground Assets/spring_Hill_Forground_cropped.png" alt="" aria-hidden="true" class="hill-foreground section-hill" />
                    </div>
                </section>
            </div>
        </div>
        <script src="script.js?v=responsive-sections-1"></script>
    </body>
</html>
